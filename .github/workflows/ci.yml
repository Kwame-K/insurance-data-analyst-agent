name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: analyst_app
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: analyst_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U analyst_app -d analyst_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://analyst_app:ci_password@localhost:5432/analyst_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check src tests

      - name: Run linting
        run: uv run ruff check src tests

      - name: Run type checking
        run: uv run mypy .

      - name: Run tests
        run: uv run pytest -v

      - name: Run test coverage
        run: >
          uv run pytest
          --cov=insurance_data_analyst_agent
          --cov-report=term-missing
          --cov-fail-under=80
