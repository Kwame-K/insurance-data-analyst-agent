[project]
name = "insurance-data-analyst-agent"
version = "0.1.0"
description = "Controlled, deterministic and auditable agent for insurance portfolio analytics (loss ratio, claim frequency, severity, exposure and portfolio quality), exposed through a CLI and a versioned REST API."
readme = "README.md"
authors = [
    { name = "Kristian", email = "kristian.klaban@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18",
    "fastapi>=0.143.1",
    "google-genai>=2.22.0",
    "groq>=1.7.0",
    "matplotlib>=3.11.1",
    "mcp>=2,<3",
    "psycopg[binary]>=3.3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
insurance-data-analyst-agent = "insurance_data_analyst_agent:main"
insurance-data-analyst = "insurance_data_analyst_agent.cli:app"
insurance-data-analyst-mcp = "insurance_data_analyst_agent.mcp_server.server:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]
